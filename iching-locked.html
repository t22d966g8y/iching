      `<span class="chip chip-sum">${sum}點</span>`+
      `<span class="chip ${isYang?'chip-yang':'chip-yin'}">${type}</span>`+
      (changing?`<span class="chip chip-change">變爻 ●</span>`:'');

    yaos.push({sum,type,changing,isYang});
    renderHistory();
    currentYao++;

    if(currentYao<6){
      updateYaoDisplay();
    } else {
      document.getElementById('throw-btn').disabled=true;
      setTimeout(showResult, 700);
    }
  }, 600);
}

function renderHistory(){
  const el=document.getElementById('yao-history');
  el.innerHTML=yaos.map((y,i)=>{
    const line=y.isYang
      ?`<div class="seg seg-yang" style="width:120px"></div>`
      :`<div class="seg seg-yin" style="width:50px"></div><div style="width:20px"></div><div class="seg seg-yin" style="width:50px"></div>`;
    return `<div class="yao-row">
      <span class="yao-idx">${NUM_NAMES[i]}</span>
      <div class="yao-line-wrap">${line}</div>
      ${y.changing?'<div class="chg-dot"></div>':'<div style="width:10px"></div>'}
    </div>`;
  }).join('');
}

// 由初爻→上爻依序組成 key
function getKey(yaosData, useChanged){
  return yaosData.map(y=>{
    const yang = useChanged && y.changing ? !y.isYang : y.isYang;
    return yang ? '1' : '0';
  }).join('');
}

function findHex(key){
  return HEXAGRAMS[key] || {
    n:'?', name:'未知', title:'卦象未收錄',
    judgment:'此卦象暫未收錄，請以六十四卦查表。',
    meaning:'此卦象暫未收錄，請以六十四卦查表。',
    advice:'請查閱易經原典。',
    career:'請查閱易經原典。', love:'請查閱易經原典。', wealth:'請查閱易經原典。',
    changeNote:'請查閱易經原典。'
  };
}

function hexLines(yaosData, useChanged){
  return yaosData.slice().map(y=>{
    const yang = useChanged && y.changing ? !y.isYang : y.isYang;
    const line = yang
      ?`<div class="h-seg h-yang" style="width:76px"></div>`
      :`<div class="h-seg h-yin" style="width:32px"></div><div style="width:12px"></div><div class="h-seg h-yin" style="width:32px"></div>`;
    return `<div class="hex-line">${line}</div>`;
  }).reverse().join('');
}


// ── 歷史紀錄加密（選用）：密碼只存在記憶體，紀錄以 AES-GCM 加密後存在本機 ──
const LS_PLAIN='iching_history', LS_ENC='iching_history_enc';
let _key=null, _salt=null, _hiddenAt=0;
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function b64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(t){const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function deriveKey(pass,salt){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptJSON(obj,key,salt){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({s:b64(salt),i:b64(iv),d:b64(ct)});
}
const isLocked=()=>!!localStorage.getItem(LS_ENC);
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
async function readHistory(){
  if(!isLocked()){try{return JSON.parse(localStorage.getItem(LS_PLAIN))||[]}catch(e){return []}}
  if(!_key)return null;
  try{
    const o=JSON.parse(localStorage.getItem(LS_ENC));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},_key,unb64(o.d));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){return null}
}
async function writeHistory(arr){
  if(!isLocked()){localStorage.setItem(LS_PLAIN,JSON.stringify(arr));return}
  localStorage.setItem(LS_ENC,await encryptJSON(arr,_key,_salt));
}
async function tryUnlock(pass){
  try{
    const o=JSON.parse(localStorage.getItem(LS_ENC));
    const salt=unb64(o.s), key=await deriveKey(pass,salt);
    await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},key,unb64(o.d));
    _key=key;_salt=salt;return true;
  }catch(e){return false}
}
function askPass({title,text,confirm=false}){
  return new Promise(res=>{
    const $=id=>document.getElementById(id), m=$('pass-modal');
    $('pw-title').textContent=title;$('pw-text').textContent=text||'';
    $('pw-input').value='';$('pw-input2').value='';$('pw-err').textContent='';
    $('pw-input2').style.display=confirm?'block':'none';
    m.classList.add('show');setTimeout(()=>$('pw-input').focus(),50);
    const done=v=>{m.classList.remove('show');res(v)};
    $('pw-cancel').onclick=()=>done(null);
    $('pw-ok').onclick=()=>{
      const p=$('pw-input').value;
      if(!p){$('pw-err').textContent='請輸入密碼';return}
      if(confirm){
        if(p.length<4){$('pw-err').textContent='至少 4 個字元';return}
        if(p!==$('pw-input2').value){$('pw-err').textContent='兩次輸入不一致';return}
      }
      done(p);
    };
  });
}
async function unlockUI(text){
  let msg=text||'輸入密碼以查看與儲存紀錄';
  for(;;){
    const p=await askPass({title:'🔒 解鎖占卜紀錄',text:msg});
    if(p===null)return false;
    if(await tryUnlock(p)){loadHistoryList();return true}
    msg='密碼不正確，請再試一次';
  }
}
async function toggleLock(){
  if(!hasCrypto()){alert('目前的環境不支援加密，請用 https 網址開啟。');return}
  if(!isLocked()){
    const p=await askPass({title:'設定密碼',text:'設定後，占卜紀錄會加密存放在這支手機。忘記密碼無法復原，只能清除全部紀錄。',confirm:true});
    if(p===null)return;
    const old=(await readHistory())||[];
    _salt=crypto.getRandomValues(new Uint8Array(16));
    _key=await deriveKey(p,_salt);
    localStorage.setItem(LS_ENC,await encryptJSON(old,_key,_salt));
    localStorage.removeItem(LS_PLAIN);
  }else{
    if(!confirm('要取消密碼，改回不加密儲存嗎？'))return;
    if(!_key&&!(await unlockUI()))return;
    const cur=(await readHistory())||[];
    localStorage.setItem(LS_PLAIN,JSON.stringify(cur));
    localStorage.removeItem(LS_ENC);_key=null;_salt=null;
  }
  loadHistoryList();
}
// 離開頁面超過 1 分鐘，自動重新上鎖
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')_hiddenAt=Date.now();
  else if(isLocked()&&_key&&_hiddenAt&&Date.now()-_hiddenAt>60000){_key=null;loadHistoryList()}
});

// ── 歷史紀錄：不再暫借全域 yaos，直接傳入 yaosData ──
async function saveToLocalStorage(q, yaosData){
  try {
    if(isLocked()&&!_key){ if(!(await unlockUI('輸入密碼以儲存本次紀錄（取消則不儲存）'))) return; }
    let history = (await readHistory()) || [];
    const now = new Date();
    const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    const mainHex = findHex(getKey(yaosData, false));
    const hasChange = yaosData.some(y=>y.changing);
    const changedHex = hasChange ? findHex(getKey(yaosData, true)) : null;

    const newRecord = {
      id: Date.now(),
      question: q || '未輸入問題',
      time: timeStr,
      castDate: now.toISOString(),
      askCategory: askCategory,
      askLoveLiuqin: askLoveLiuqin,
      yaos: yaosData,
      hexName: mainHex.title + (changedHex ? ` 之 ${changedHex.name}` : '')
    };

    history.unshift(newRecord);
    // 最多保留 MAX_HISTORY 筆
    if(history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
    await writeHistory(history);
    loadHistoryList();
  } catch(e) {
    console.error('儲存紀錄失敗：', e);
  }
}

async function loadHistoryList(){
  const box = document.getElementById('history-list-box');
  if(!box) return;
  const lb = document.getElementById('lock-btn');
  if(lb) lb.textContent = isLocked() ? '🔒 密碼已啟用' : '🔓 設定密碼';
  if(isLocked() && !_key){
    box.innerHTML = `<div class="history-empty">🔒 紀錄已加密<br><button class="btn-clear-history" style="color:var(--gold2);font-size:13px;margin-top:8px" onclick="unlockUI()">輸入密碼解鎖</button></div>`;
    return;
  }
  const history = (await readHistory()) || [];
  if(history.length === 0){
    box.innerHTML = `<div class="history-empty">暫無占卜紀錄</div>`;
    return;
  }
  box.innerHTML = history.map(item=>`
    <div class="history-item" onclick="viewHistoryItem(${Number(item.id)})">
      <div class="history-item-left">
        <div class="history-item-q">${esc(item.question)}</div>
        <div class="history-item-time">${esc(item.time)}</div>
      </div>
      <div class="history-item-right">${esc(item.hexName)}</div>
    </div>
  `).join('');
}

function openDeleteModal(){ document.getElementById('delete-modal').classList.add('show'); }
function closeDeleteModal(){ document.getElementById('delete-modal').classList.remove('show'); }
function confirmClearHistory(){
  localStorage.removeItem(LS_PLAIN);
  localStorage.removeItem(LS_ENC);
  _key=null;_salt=null;
  closeDeleteModal();
  loadHistoryList();
}

async function viewHistoryItem(id){
  let history = (await readHistory()) || [];
  const record = history.find(item=>item.id===id);
  if(!record) return;
  question = record.question;
  yaos = record.yaos;
  askCategory = record.askCategory || 'general';
  askLoveLiuqin = record.askLoveLiuqin || null;
  const castDate = record.castDate ? new Date(record.castDate) : parseTimeStr(record.time);
  buildResultPageUI(yaos, castDate);
  showScreen('s-result');
}

// 舊紀錄沒有 castDate 欄位時，退而求其次解析 "YYYY-MM-DD HH:MM" 字串
function parseTimeStr(str){
  if(!str) return new Date();
  const m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return new Date();
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}

function toggleNajia(){
  const box = document.getElementById('najia-box');
  const btn = document.getElementById('najia-toggle-btn');
  if(!box) return;
  const showing = box.style.display !== 'none';
  box.style.display = showing ? 'none' : 'block';
  btn.textContent = showing ? '☯ 展開進階模式：六爻納甲解讀' : '☯ 收合進階模式：六爻納甲解讀';
}

function buildResultPageUI(yaosData, castDate){
  const mainKey = getKey(yaosData, false);
  const mainHex = findHex(mainKey);
  const hasChange = yaosData.some(y=>y.changing);
  const changedHex = hasChange ? findHex(getKey(yaosData, true)) : null;
  const changingList = yaosData.map((y,i)=>y.changing?NUM_NAMES[i]+'爻':null).filter(Boolean);

  // 先算好六爻納甲的吉凶判斷，放在最上面當「一句話結論」，其他都是補充細節
  const najia = buildNajiaAnalysis(yaosData, castDate);
  const verdict = najia ? computeVerdict(najia, askCategory || 'general', askLoveLiuqin) : null;

  let h='';
  if(question) h+=`<div class="result-q">問：${question}</div>`;
  h+=`<div class="result-eyebrow">— 卦象解讀 —</div>`;

  if(verdict){
    const colorMap = {'v-good':'#5ec98a','v-bad':'#e07a7a','v-mid':'#e0c05e','v-void':'#a78bfa'};
    const color = colorMap[verdict.verdictClass] || '#ccc';
    h+=`<div style="border:1px solid ${color}88;background:${color}22;border-radius:14px;padding:14px 16px;margin-bottom:16px;text-align:center;">
      <div style="font-size:11px;opacity:.7;margin-bottom:4px;">◆ 如果只看一句話 ◆</div>
      <div style="font-size:22px;font-weight:800;color:${color};margin-bottom:6px;">${verdict.verdict}</div>
      <div style="font-size:13px;line-height:1.7;opacity:.95;">${getCtxSentence(verdict, askCategory||'general')}</div>
      <div style="font-size:11px;opacity:.55;margin-top:8px;">
        這是用「六爻」方法算出的結論，完整原因在頁面下方「六爻納甲」區塊；中間的「卦辭原意／整體運勢」則是另一套獨立的解讀角度，兩邊可以互相參考。
      </div>
    </div>`;
  }

  h+=buildOracleCard(mainKey, mainHex, changedHex);

  // 卦象結構解析（新增：自動由上下卦組合生成，幫助新手理解「為什麼是這個卦」）
  h+=`<div class="rblock rblock-structure">
    <div class="rblock-label lb-teal">◇ 卦象結構解析</div>
    <div class="rblock-text">${getStructureAnalysis(mainKey)}</div>
  </div>`;

  // 卦辭原意
  h+=`<div class="rblock rblock-judgment">
    <div class="rblock-label lb-purple">❖ 卦辭原意</div>
    <div class="rblock-text rblock-quote">${mainHex.judgment}</div>
    ${JUDGMENT_GLOSS[mainHex.n] ? `<div class="judgment-gloss"><b>白話翻譯：</b>${JUDGMENT_GLOSS[mainHex.n]}</div>` : ''}
  </div>`;

  // 整體運勢 + 行事建議
  h+=`<div class="rblock rblock-meaning">
    <div class="rblock-label lb-gold">✦ 整體運勢</div>
    <div class="rblock-text">${mainHex.meaning}</div>
  </div>`;
  h+=`<div class="rblock rblock-advice">
    <div class="rblock-label lb-teal">◈ 行事建議</div>
    <div class="rblock-text">${mainHex.advice}</div>
  </div>`;

  // 分類解讀：事業 / 感情 / 財運（分頁籤）── 自動跳到使用者一開始選的類型
  const TAB_CATS = ['career','love','wealth'];
  const TAB_LABELS = {career:'事業', love:'感情', wealth:'財運'};
  const activeTab = TAB_CATS.includes(askCategory) ? askCategory : 'career';
  h+=`<div class="category-tabs" id="cat-tabs">
    ${TAB_CATS.map(c=>`<button class="cat-tab${c===activeTab?' active':''}" data-cat="${c}" onclick="switchCategory(this,'${c}')">${TAB_LABELS[c]}</button>`).join('')}
  </div>`;
  h+=`<div class="rblock rblock-category" id="cat-content">
    <div class="rblock-label lb-gold2" id="cat-label">⬢ ${TAB_LABELS[activeTab]}解讀</div>
    <div class="rblock-text" id="cat-text">${mainHex[activeTab]}</div>
  </div>`;
  if(!TAB_CATS.includes(askCategory) && askCategory!=='general'){
    const catLabel = (CATEGORY_MAP[askCategory]||{}).label || '';
    h+=`<div style="font-size:12px;opacity:.65;line-height:1.7;padding:0 4px 14px;">
      ※ 你問的是「${catLabel}」，上面這幾個分頁目前還沒有針對這類問題寫專屬解讀，
      可以先參考「整體運勢」與「行事建議」，或直接看下面依你的問題客製化整理的六爻分析。
    </div>`;
  }

  if(changedHex){
    h+=`<div class="rblock rblock-change">
      <div class="rblock-label lb-red">● 變卦提示（${changedHex.title}）</div>
      <div class="rblock-text">${changedHex.meaning}<br><br>${changedHex.advice}</div>
    </div>`;
    h+=`<div class="rblock rblock-changenote">
      <div class="rblock-label lb-red">◆ 本卦至變卦的轉化</div>
      <div class="rblock-text">${mainHex.changeNote}</div>
    </div>`;
  }
  if(changingList.length){
    h+=`<div class="change-pills">變爻：${changingList.join('、')}</div>`;
    // 新增：針對每一個變爻，給出通用爻位深度解讀（位置意義＋得正/不得正判斷）
    yaosData.forEach((y,i)=>{
      if(!y.changing) return;
      const lineNajia = najia ? najia.lines[i] : null;
      h+=`<div class="rblock rblock-yaoposition">
        <div class="rblock-label lb-red">▲ ${NUM_NAMES[i]}爻深度解讀</div>
        <div class="rblock-text">${getYaoPositionAnalysis(i, y.isYang, lineNajia)}</div>
      </div>`;
    });
  }
  // ── 進階模式：六爻納甲解讀（與上方義理易共用同一次搖卦結果，najia/verdict 已在最上方算好）──
  if(najia){
    h += `<div style="font-size:12px;opacity:.6;text-align:center;margin:16px 0 8px;line-height:1.6;">
      ── 以上是「卦辭」角度的解讀；下面會把最上方那句「六爻」結論的完整原因展開給你看 ──<br>
      這兩套是不同的分析角度，方向大致相同時可以更放心，若有落差，建議兩邊都納入考慮
    </div>`;
    const yingqi = computeYingQi(najia, verdict, castDate);
    h += buildVerdictHTML(verdict, askCategory || 'general', question, yingqi);
  }
  h+=`<button class="btn-reset" id="najia-toggle-btn" onclick="toggleNajia()" style="margin-top:6px;background:rgba(155,89,182,0.18);border:1px solid rgba(155,89,182,0.5);">☯ 展開進階模式：六爻納甲解讀</button>`;
  h+=`<div id="najia-box" style="display:none;margin-top:12px;">
    <div class="rblock rblock-najia">
      <div class="rblock-label lb-purple">☯ 六爻納甲（六親／六獸／世應）</div>
      <div class="rblock-text">${buildNajiaHTML(najia)}</div>
    </div>
  </div>`;

  h+=`<button class="btn-reset" onclick="resetAll()">✦ 返回首頁</button>`;
  document.getElementById('result-content').innerHTML = h;

  // 記住目前卦象資料供分頁籤切換使用
  window.__currentMainHex = mainHex;
}

function switchCategory(btn, cat){
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const labels = {career:'⬢ 事業解讀', love:'♡ 感情解讀', wealth:'◈ 財運解讀'};
  const hex = window.__currentMainHex;
  if(!hex) return;
  document.getElementById('cat-label').textContent = labels[cat];
  document.getElementById('cat-text').textContent = hex[cat];
}

function showResult(){
  const castDate = new Date();
  saveToLocalStorage(question, yaos);
  buildResultPageUI(yaos, castDate);
  showScreen('s-result');
}

function resetAll(){
  document.getElementById('q-input').value='';
  loadHistoryList();
  showScreen('s-intro');
}
